<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Check In a Book</title>
    <link rel="stylesheet" href="css/check-in.css">
  </head>
  <body>
    <nav><a href="check-out.html">Check out</a></nav>
    <h1><u>Check In a Book</u></h1>

    <form id="checkin-form">
      <h2>Borrower</h2>

      <label for="first-name">Name</label>
      <input type="text" id="first-name" placeholder="Enter name" />

      <label for="last-name">Surname</label>
      <input type="text" id="last-name" placeholder="Enter surname" />

      <label for="email">Email</label>
      <input type="email" id="email" placeholder="Enter email" required />

      <h2>Book</h2>

      <label for="title">Title</label>
      <input type="text" id="title" placeholder="Book title" required />

      <label for="date">Date</label>
      <input type="date" id="date" />

      <p id="form-message" class="form-message"></p>

      <div class="submit">
        <button type="submit" id="submit-button">Submit</button>
      </div>
    </form>

    <div class="back">
      <a href="/">Back</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="scripts/check-in.js"></script>
  </body>
</html>
