<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Imagine Scholar Library</title>
  <link rel="stylesheet" href="css/index.css" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="alternate icon" href="favicon.ico" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
</head>

<body>
  <h1><u>Imagine Scholar Library</u></h1>

  <div class="cards">
    <div class="card">
      <h2>Borrow a Book</h2>
      <a class="button" href="check-out.html">Borrow</a>
    </div>
    <div class="card">
      <h2>Return a Book</h2>
      <a class="button" href="check-in.html">Return</a>
    </div>
  </div>

  <div class="librarian">
    <h2><u>Librarian Login</u></h2>
    <form id="login-form">
      <label for="login-email">Email</label>
      <input type="email" id="login-email" placeholder="Enter your email" required />
      <label for="password">Password</label>
      <div class="password-field">
        <input type="password" id="password" placeholder="Enter password" required />
        <button type="button" id="toggle-password" class="toggle-password" aria-label="Show password"></button>
      </div>
      <p id="login-message" class="form-message"></p>
      <button type="submit" id="login-button">Log In</button>
    </form>
  </div>

  <footer>Impact starts with a vision</footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="scripts/index.js"></script>
</body>

</html>
